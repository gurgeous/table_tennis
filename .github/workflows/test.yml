name: test

on:
  push:
    branches: [main]
    paths-ignore: [README.md, "screenshots/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      max-parallel: 3
      matrix:
        os: [macos, ubuntu, windows]
        ruby-version: [3.0, 3.4, 4.0]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          mise_toml: |
            [hooks]
            postinstall = ['bundle install']
            [tools]
            just = "latest"
            ruby = "${{ matrix.ruby-version }}"
      - run: just ci
